basePath: /api/v1
definitions:
  dto.ActivityDTO:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.ActivityListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.ActivityDTO'
        type: array
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
    type: object
  dto.AuthOutput:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.CreateEventInput:
    properties:
      description:
        maxLength: 1024
        type: string
      name:
        maxLength: 128
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateLocationInput:
    properties:
      address:
        maxLength: 255
        minLength: 3
        type: string
      name:
        maxLength: 128
        minLength: 3
        type: string
    required:
    - address
    - name
    type: object
  dto.CreateMedalerInput:
    properties:
      email:
        type: string
      name:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - email
    - name
    type: object
  dto.CreateUserInput:
    properties:
      email:
        type: string
      event_id:
        type: integer
      password:
        minLength: 8
        type: string
      role:
        $ref: '#/definitions/user.Role'
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - email
    - password
    - role
    - username
    type: object
  dto.EventDTO:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.EventListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.EventDTO'
        type: array
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
    type: object
  dto.LocationDTO:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.LocationListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.LocationDTO'
        type: array
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
    type: object
  dto.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.MedalerDTO:
    properties:
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
    type: object
  dto.MedalerListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.MedalerDTO'
        type: array
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
    type: object
  dto.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_records:
        type: integer
    type: object
  dto.Problem:
    properties:
      code:
        type: string
      detail:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      trace_id:
        type: string
      type:
        type: string
    type: object
  dto.RefreshTokenInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.UpdateEventInput:
    properties:
      description:
        maxLength: 1024
        type: string
      name:
        maxLength: 128
        minLength: 1
        type: string
    type: object
  dto.UpdateLocationInput:
    properties:
