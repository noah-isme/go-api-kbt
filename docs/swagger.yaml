          $ref: '#/definitions/dto.UserDTO'
        type: array
      meta:
        $ref: '#/definitions/dto.PaginationMeta'
    type: object
  user.Role:
    enum:
    - owner
    - admin
    - cashier
    type: string
    x-enum-varnames:
    - RoleOwner
    - RoleAdmin
    - RoleCashier
host: localhost:8080
info:
