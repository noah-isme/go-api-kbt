      is_active:
        type: boolean
      name:
        maxLength: 64
        minLength: 3
        type: string
    type: object
  dto.UpdateUserInput:
    properties:
      email:
        type: string
      event_id:
        type: integer
      password:
        minLength: 8
        type: string
      role:
        $ref: '#/definitions/user.Role'
      username:
        maxLength: 64
        minLength: 3
        type: string
    type: object
  dto.UserDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      event_id:
        type: integer
      id:
        type: integer
      last_login_at:
        type: string
      role:
        $ref: '#/definitions/user.Role'
      updated_at:
        type: string
      username:
        type: string
    type: object
  dto.UserListResponse:
    properties:
