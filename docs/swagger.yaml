paths:
  /activities:
    get:
      description: Retrieve a list of all activities with pagination and filtering
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Number of items per page
        in: query
        name: limit
        type: integer
      - description: Search query
        in: query
        name: q
        type: string
      - description: Sort order (e.g., id asc, name desc)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActivityListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Problem'
      summary: Get all activities
      tags:
      - Activity
  /activities/{id}:
    get:
      description: Retrieve a single activity by its ID
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ActivityDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Problem'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Problem'
      summary: Get an activity by ID
      tags:
      - Activity
